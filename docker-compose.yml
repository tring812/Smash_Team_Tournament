# Chỉ cho DEV. Mật khẩu dưới đây là giá trị dev cục bộ, không dùng ở môi trường thật.
services:
  db:
    image: postgres:16-alpine   # TODO: ghim digest (@sha256:...) khi đưa vào CI
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smashteam_tournament
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
volumes:
  db:
